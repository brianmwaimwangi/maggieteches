<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - {{ site_name }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
{% include "_theme_head.html" %}
<style>body { background: linear-gradient(135deg, #fff8f0, #ffe4c2); min-height: 100vh; }
[data-bs-theme="dark"] body { background: linear-gradient(135deg, #000000, #1a0f00); min-height: 100vh; }</style>
</head>
<body>
<div class="position-fixed top-0 end-0 p-3">{% include "_theme_toggle_btn.html" %}</div>
<div class="container d-flex align-items-center justify-content-center min-vh-100">
  <div class="card shadow-lg p-4" style="max-width:420px; width:100%; border-radius:20px;">
    <h2 class="text-center fw-bold"><i class="bi bi-bag text-primary"></i> {{ site_name }}</h2>
    <h5 class="text-center text-muted mb-3">Welcome Back</h5>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="alert alert-{{ cat }}">{{ msg }}</div>{% endfor %}
    {% endwith %}
    <form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label fw-semibold">Username</label><input type="text" name="username" class="form-control" required placeholder="Enter username"></div>
      <div class="mb-3"><label class="form-label fw-semibold">Password</label><input type="password" name="password" class="form-control" required placeholder="Enter password"></div>
      <button class="btn btn-primary w-100 py-2 rounded-pill">Login <i class="bi bi-arrow-right"></i></button>
    </form>

    <p class="text-center"><a href="{{ url_for('register') }}" class="text-decoration-none">Create Account <i class="bi bi-person-plus"></i></a></p>
  </div>
</div>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</body>
</html>
